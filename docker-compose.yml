# docker-compose.yml
services:
  mongodb:
    image: mongo:7.0
    container_name: mongo_local
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-example}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-appdb}
    volumes:
      - mongo_data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "mongodb://root:example@localhost:27017/admin?authSource=admin", "--eval", "db.runCommand({ping:1}).ok"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: node_chat_dev:latest
    container_name: node_chat_dev
    working_dir: /app
    # 호스트 소스 마운트 + node_modules는 컨테이너 볼륨 사용
    volumes:
      - .:/app
      - /app/node_modules
      - root_modules:/app/node_modules
      - express_modules:/app/chapter3/express-server/node_modules
      - nest_modules:/app/chapter3/nest-server/node_modules
      - ./docker/node/.npmrc:/home/node/.npmrc:ro
    ports:
      - "3000:3000"
      - "3001:3001"
    environment:
      - MONGODB_URI='${MONGODB_URI}'
      # 윈도우/WSL에서 파일감시 강화
      #- CHOKIDAR_USEPOLLING=true
      #- WATCHPACK_POLLING=true
      - WSL2=true # Docker Desktop에서 WSL2 백엔진 사용 권장 (소스 디렉토리는 **WSL2 파일시스템(예: \wsl$…)**에 두면 I/O가 훨씬 빠름)
      # 타임존/로케일(선택
      - TZ=Asia/Seoul
      - NODE_ENV=development
      - PORT=3000          # Express 기본
      - NEST_PORT=3001     # 정보 전달용(코드에선 process.env.PORT 사용)


    # 루트가 아닌 node 유저로 실행
    user: "1000:1000"
    command: ["npm", "run", "dev"]

volumes:
  mongo_data:
  root_modules:
  express_modules:
  nest_modules: